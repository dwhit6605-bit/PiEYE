# PiEYE — nginx reverse proxy with Let's Encrypt (certbot).
#
#   sudo cp deploy/nginx-pieye.conf /etc/nginx/sites-available/pieye
#   sudo ln -s /etc/nginx/sites-available/pieye /etc/nginx/sites-enabled/
#   # obtain a cert (edit hostname first):
#   sudo certbot --nginx -d pieye.example.com        # HTTP-01 (needs port 80 public)
#   #   ...or DNS-01 for an internal host, e.g.:
#   #   sudo certbot certonly --dns-cloudflare -d pieye.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# config.yaml:  server.secure_cookies: true,  server.behind_proxy: true

server {
    listen 80;
    server_name pieye.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pieye.example.com;

    ssl_certificate     /etc/letsencrypt/live/pieye.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pieye.example.com/privkey.pem;

    # MJPEG live stream: never buffer, allow a long-lived connection
    location ~ /stream\.mjpg$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
