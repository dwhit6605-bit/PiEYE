<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161c"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="snap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26332b"/>
      <stop offset="1" stop-color="#1a231d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ===== left column ===== -->
  <g>
    <circle cx="96" cy="120" r="15" fill="none" stroke="#4c8dff" stroke-width="5"/>
    <circle cx="96" cy="120" r="6" fill="#4c8dff"/>
    <text x="126" y="135" font-size="60" font-weight="800" fill="#e7edf3" letter-spacing="1">PiEYE</text>

    <text x="82" y="196" font-size="27" fill="#93a1b0">Private security vision on a Raspberry&#160;Pi&#160;4.</text>

    <g font-size="21" fill="#cdd7e0">
      <circle cx="90" cy="262" r="5" fill="#35c28f"/><text x="110" y="269">Offline person / vehicle / animal detection</text>
      <circle cx="90" cy="308" r="5" fill="#35c28f"/><text x="110" y="315">Instant push alerts with annotated snapshots</text>
      <circle cx="90" cy="354" r="5" fill="#35c28f"/><text x="110" y="361">Installable PWA — live MJPEG + event history</text>
      <circle cx="90" cy="400" r="5" fill="#35c28f"/><text x="110" y="407">One-line install · optional Claude descriptions</text>
    </g>

    <rect x="82" y="470" width="600" height="56" rx="12" fill="#171b21" stroke="#2a3139"/>
    <text x="104" y="505" font-size="17" font-family="ui-monospace, Menlo, monospace">
      <tspan fill="#35c28f">$ </tspan><tspan fill="#93a1b0">curl -fsSL …/PiEYE/main/install.sh | bash</tspan>
    </text>
  </g>

  <!-- ===== phone mockup (Events screen) ===== -->
  <g>
    <rect x="772" y="52" width="360" height="524" rx="46" fill="#05070a" stroke="#2a3139" stroke-width="2"/>
    <rect x="788" y="68" width="328" height="492" rx="30" fill="#0f1216"/>

    <!-- status bar -->
    <circle cx="806" cy="100" r="7" fill="none" stroke="#4c8dff" stroke-width="2.5"/>
    <circle cx="806" cy="100" r="2.6" fill="#4c8dff"/>
    <text x="820" y="105" font-size="15" font-weight="700" fill="#e7edf3">PiEYE</text>
    <circle cx="1018" cy="100" r="5" fill="#35c28f"/>
    <text x="1096" y="105" font-size="13" fill="#93a1b0" text-anchor="end">2 cam · yolo</text>

    <text x="806" y="150" font-size="22" font-weight="700" fill="#e7edf3">Events</text>

    <!-- stat tiles -->
    <g>
      <rect x="806" y="166" width="90" height="54" rx="11" fill="#171b21" stroke="#2a3139"/>
      <text x="820" y="196" font-size="22" font-weight="700" fill="#e7edf3">128</text>
      <text x="820" y="212" font-size="10" fill="#93a1b0">Total</text>
      <rect x="906" y="166" width="90" height="54" rx="11" fill="#171b21" stroke="#2a3139"/>
      <text x="920" y="196" font-size="22" font-weight="700" fill="#e7edf3">6</text>
      <text x="920" y="212" font-size="10" fill="#93a1b0">Last 24h</text>
      <rect x="1006" y="166" width="90" height="54" rx="11" fill="#171b21" stroke="#2a3139"/>
      <text x="1020" y="196" font-size="22" font-weight="700" fill="#e7edf3">2</text>
      <text x="1020" y="212" font-size="10" fill="#93a1b0">Cameras</text>
    </g>

    <!-- event card -->
    <rect x="806" y="234" width="290" height="252" rx="14" fill="#171b21" stroke="#2a3139"/>
    <path d="M806 248 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v98 h-290 z" fill="url(#snap)"/>
    <rect x="922" y="262" width="96" height="70" rx="3" fill="none" stroke="#ff5c5c" stroke-width="2.5"/>
    <text x="922" y="256" font-size="12" fill="#ff5c5c" font-weight="600">person 94%</text>

    <rect x="820" y="360" width="92" height="22" rx="11" fill="#1b2c4d"/>
    <text x="866" y="375" font-size="12" font-weight="600" fill="#4c8dff" text-anchor="middle">front-door</text>
    <text x="820" y="404" font-size="13" fill="#c3ccd5">A delivery courier in a brown</text>
    <text x="820" y="423" font-size="13" fill="#c3ccd5">uniform is at the door.</text>
    <text x="820" y="452" font-size="12" fill="#93a1b0">person · Jul 26, 2:09 PM</text>

    <!-- tab bar -->
    <line x1="788" y1="512" x2="1116" y2="512" stroke="#2a3139"/>
    <text x="846" y="544" font-size="12" fill="#93a1b0" text-anchor="middle">Live</text>
    <text x="952" y="544" font-size="12" fill="#4c8dff" font-weight="700" text-anchor="middle">Events</text>
    <text x="1064" y="544" font-size="12" fill="#93a1b0" text-anchor="middle">Settings</text>
  </g>
</svg>
