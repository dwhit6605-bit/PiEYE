name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps (everything except torch/ultralytics)
        run: |
          python -m pip install --upgrade pip
          # Mirror requirements.txt minus ultralytics (torch is far too heavy for CI),
          # plus httpx for fastapi's TestClient.
          grep -viE '^\s*(ultralytics|#)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt httpx
      - name: Byte-compile
        run: python -m py_compile vision/*.py
      - name: Smoke test (store + API + auth)
        run: python scripts/smoketest.py
      - name: Installer shellcheck
        run: bash -n install.sh
