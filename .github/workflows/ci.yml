name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime deps (no torch)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pyyaml numpy opencv-python-headless requests httpx
      - name: Byte-compile
        run: python -m py_compile vision/*.py
      - name: Smoke test (store + API + auth)
        run: python scripts/smoketest.py
      - name: Installer shellcheck
        run: bash -n install.sh
